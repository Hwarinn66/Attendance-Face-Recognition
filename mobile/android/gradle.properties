org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Release builds without R8 (read by the Flutter Gradle plugin, FlutterPluginUtils.shouldShrinkResources).
# JNI-based plugins (package:jni, shared_preferences_android) look up Kotlin/Java classes, methods and fields
# by name from Dart, which R8 cannot see: renamed kotlin.coroutines.Continuation and CoroutineSingletons made
# the release app fail at start-up with NoSuchMethodError / ClassNotFoundException.
shrink=false
