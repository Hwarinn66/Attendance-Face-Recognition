[project]
name = "absen-backend"
version = "0.1.0"
description = "Face recognition attendance system — API, attendance engine and biometric pipeline"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.140,<0.150",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "numpy>=2.1,<3",
    # OpenCV 5 changed several DNN/face APIs; stay on the 4.x line that ships FaceDetectorYN / FaceRecognizerSF.
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.20,<2",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions/*_pre_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL", "N", "DTZ", "T20"]
ignore = [
    "PLR0913",  # FastAPI dependency injection needs many parameters
    "PLR2004",  # magic values are common in CV thresholds; they live in config
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "PLR0917",  # service functions take explicit collaborators positionally
    "N818",     # domain exceptions (NotFound, Conflict, ...) read better without an Error suffix
    "S101",     # asserts are used only as type-narrowing invariants; security checks always raise explicitly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "DTZ001", "PLC0415"]
"scripts/**" = ["T201", "S310", "S603", "S607"]
"app/cli.py" = ["T201"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not models'"
markers = [
    "models: tests that run real pretrained models (require downloaded weights; run with -m models)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
